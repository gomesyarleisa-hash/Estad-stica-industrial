}nav{display:flex;gap:10px;flex-wrap:wrap} @media(max-width:600px){#app{padding:14px}.panel{padding:20px}header{padding:24px}}
</style></head><body><main id="app"><header><h1>Estadística Industrial</h1><div>Laboratorio de distribuciones de muestreo</div><p>Cuatro actividades · resultados calculados · datos editables</p></header><nav class="tabs" id="tabs"></nav><section id="content"></section></main><script>
const base=[1,9,12,14,16,20];let current=0;const names=['1. Muestreo de medias','2. Medias esperadas','3. Probabilidad y normal','4. Proporciones, diferencias y sumas'];const $=s=>document.querySelector(s);function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}function sd(a){let m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}function popsd(a){let m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}function choose(a,n,rep){let out=[];function rec(p){if(p.length===n){out.push(p.slice());return}for(let i=0;i<a.length;i++){if(rep||!p.includes(i)){p.push(i);rec(p);p.pop()}}}rec([]);return out.map(ix=>ix.map(i=>a[i]))}function fmt(x){return Number(x).toFixed(4)}function table(rows,heads){return `<div style="overflow:auto"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function render(){ $('#tabs').innerHTML=names.map((n,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()">${n}</button>`).join('');let c=$('#content');if(current===0)one(c);if(current===1)two(c);if(current===2)three(c);if(current===3)four(c)}function one(c){c.innerHTML=`<div class="panel"><h2>Actividad 1 · Distribución de medias</h2><p><b>Contexto:</b> una pequeña planta registra seis tiempos de operación (minutos). Se toman todas las muestras posibles de tamaño 2.</p><label class="field">Población (separa números con coma)<input id="pop" value="${base.join(',')}"></label><div id="out"></div></div>`;$('#pop').oninput=calc;calc()}function calc(){let a=$('#pop').value.split(',').map(Number);if(a.length<2||a.some(x=>!Number.isFinite(x))){$('#out').innerHTML='Ingresa al menos dos números válidos.';return}let rows=[];let mu=mean(a),sigma=popsd(a);rows.push(`<div class="result"><b>Primero: población</b><br>Media poblacional: ${fmt(mu)}<br>Desviación típica poblacional σₓ: ${fmt(sigma)}</div><p><b>Guía de fórmulas:</b> Varianza de las medias: σ²/n · Desviación de las medias: σ/√n · Número de muestras con reposición: Nⁿ · Sin reposición: combinaciones de N elementos tomados de n en n.</p>`);for(let rep of [true,false]){let ss=choose(a,2,rep),ms=ss.map(mean);let sampleDeviation=popsd(ms);rows.push(`<h3>${rep?'a) Con reposición':'b) Sin reposición'}</h3><p>Número de muestras: <b>${ss.length}</b></p><p>Medias de muestras: <b>${ms.map(fmt).join(', ')}</b></p><p>Media de las medias: <b>${fmt(mean(ms))}</b> · Desviación muestral de las medias σₓ (calculada con N): <b>${fmt(sampleDeviation)}</b></p>${table(ss.map((s,i)=>[s.join(', '),fmt(ms[i])]),['Muestra','Media'])}`)}$('#out').innerHTML=rows.join('')}
function two(c){let vals=[8,10,12,14,16];c.innerHTML=`<div class="panel"><h2>Actividad 2 · Medias esperadas</h2><p><b>Contexto:</b> se estudian minutos de espera en una estación de trabajo. Cada muestra contiene observaciones tomadas al azar.</p><label class="field">Valores observados<input id="v2" value="${vals.join(',')}"></label><div id="o2"></div><p class="muted">La media esperada de la media muestral coincide con la media de la población; la desviación esperada de las medias depende del tamaño muestral y del método de selección.</p></div>`;$('#v2').oninput=()=>{let a=$('#v2').value.split(',').map(Number);if(a.length<2||a.some(x=>!Number.isFinite(x)))return;$('#o2').innerHTML=`<div class="result">Media: ${fmt(mean(a))} · Desviación típica poblacional: ${fmt(popsd(a))}<br>Para n=2, con reposición: ${fmt(popsd(a)/Math.sqrt(2))}<br>Para n=2, sin reposición (corrección finita): ${fmt(popsd(a)/Math.sqrt(2)*Math.sqrt((a.length-2)/(a.length-1)))}</div>`};$('#v2').oninput()}
function three(c){c.innerHTML=`<div class="panel"><h2>Actividad 3 · Probabilidad en la normal</h2><p><b>Contexto:</b> el tiempo medio de una operación se aproxima a una distribución normal. Calcula la probabilidad de que la media sea menor o igual que el límite indicado.</p><div class="grid"><label class="field">Media μ<input id="mu" type="number" value="12" step="any"></label><label class="field">Desviación típica σ<input id="sig" type="number" value="2" step="any"></label><label class="field">Límite x<input id="xx" type="number" value="14" step="any"></label></div><div id="o3"></div><svg class="chart" viewBox="0 0 600 260" role="img" aria-label="Campana normal con área de probabilidad"><path d="M35 220H565" stroke="currentColor"/><path id="shade" fill="#d9e2f5" opacity=".95"/><path id="curve" fill="none" stroke="#6d83b2" stroke-width="3"/><line id="mark" y1="35" y2="220" stroke="#b66f91" stroke-dasharray="5 5"/><text x="300" y="250" text-anchor="middle" fill="currentColor">Distribución normal · área sombreada = P(X ≤ x)</text></svg><p class="muted">La campana es una aproximación normal; para eventos de muestras discretas, la probabilidad exacta se obtiene contando las muestras favorables.</p></div>`;['mu','sig','xx'].forEach(id=>$('#'+id).oninput=draw);draw()}function draw(){let mu=+$('#mu').value,sig=+$('#sig').value,x=+$('#xx').value;if(sig<=0)return;let z=(x-mu)/sig;function erf(t){let sign=t<0?-1:1;t=Math.abs(t);let q=1/(1+.3275911*t);let y=1-(((((1.061405429*q-1.453152027)*q)+1.421413741)*q-.284496736)*q+.254829592)*q*Math.exp(-t*t);return sign*y}let p=(1+erf(z/Math.sqrt(2)))/2;$('#o3').innerHTML=`<div class="result">z = ${fmt(z)} · P(X ≤ ${x}) ≈ <b>${(p*100).toFixed(2)}%</b></div>`;let pts=[],area='M35 220 ';for(let i=0;i<=200;i++){let xx=-4+i*.04,yy=220-170*Math.exp(-xx*xx/2);pts.push([35+i*2.65,yy])}$('#curve').setAttribute('d','M'+pts.map(p=>p.join(' ')).join(' L'));let cut=Math.max(0,Math.min(200,Math.round((z+4)/8*200)));$('#shade').setAttribute('d','M35 220 L'+pts.slice(0,cut+1).map(p=>p.join(' ')).join(' L')+' L'+(35+cut*2.65)+' 220 Z');$('#mark').setAttribute('x1',35+cut*2.65);$('#mark').setAttribute('x2',35+cut*2.65)}
function four(c){c.innerHTML=`<div class="panel"><h2>Actividad 4 · Proporciones, diferencias y sumas</h2><p><b>Contexto:</b> dos líneas de producción revisan productos; se comparan proporciones defectuosas y se estudia la suma de tiempos de dos procesos.</p><div class="grid"><label class="field">Línea A: defectuosos<input id="da" type="number" value="8"></label><label class="field">Línea A: revisados<input id="na" type="number" value="100"></label><label class="field">Línea B: defectuosos<input id="db" type="number" value="5"></label><label class="field">Línea B: revisados<input id="nb" type="number" value="100"></label></div><div id="o4"></div><h3>Suma de tiempos</h3><p>Si el proceso A tarda 10±2 minutos y B tarda 6±1.5 minutos, con independencia:</p><div class="result">Media de la suma = 16 min · Desviación típica de la suma = ${fmt(Math.sqrt(2**2+1.5**2))} min</div><p class="muted">Para proporciones, la desviación típica de la diferencia se calcula combinando las varianzas de ambas proporciones (si las muestras son independientes).</p></div>`;['da','na','db','nb'].forEach(id=>$('#'+id).oninput=calc4);calc4()}function calc4(){let da=+$('#da').value,na=+$('#na').value,db=+$('#db').value,nb=+$('#nb').value;if(na<=0||nb<=0)return;let pa=da/na,pb=db/nb,d=pa-pb,se=Math.sqrt(pa*(1-pa)/na+pb*(1-pb)/nb);$('#o4').innerHTML=`<div class="result">Proporción A: ${(pa*100).toFixed(2)}% · B: ${(pb*100).toFixed(2)}%<br>Diferencia A−B: ${(d*100).toFixed(2)} puntos porcentuales<br>Desviación típica de la diferencia: ${(se*100).toFixed(2)} puntos porcentuales</div>`}render();
</script><script>

(()=>{
const $=s=>document.querySelector(s), fmt=x=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:4}), avg=a=>a.reduce((s,x)=>s+x,0)/a.length, variance=a=>{const m=avg(a);return a.reduce((s,x)=>s+(x-m)**2,0)/a.length}, sampleVar=a=>{const m=avg(a);return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)}, sd=a=>Math.sqrt(variance(a)), sdx=a=>Math.sqrt(sampleVar(a));
const style=document.createElement('style');style.textContent=`#app{max-width:1240px;padding:34px 28px 60px}header{padding:38px 42px;margin-bottom:28px;background:linear-gradient(115deg,#e8edf9,#f5eaf1)}header p{margin-bottom:0;color:#59647b}.tabs{gap:10px;margin:22px 0 26px}.tabs button{background:#fff;border:1px solid #e6e5ed;color:#58647e;padding:13px 18px;border-radius:13px}.tabs button.active{background:#657da9;color:white;border-color:#657da9}.panel{padding:clamp(24px,3.5vw,40px);margin:22px 0 28px;border-color:#e8e7ee;box-shadow:0 10px 32px #2839560a}.panel h2{font-size:1.45rem;letter-spacing:-.02em}.panel h3{font-size:1.08rem;margin:24px 0 12px}.intro{max-width:850px;color:#555f73;margin:0 0 24px}.subtabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.subtabs button{background:#f4f0f5;border:1px solid #e8e1eb;color:#6b5b70}.subtabs button.active{background:#dce6f5;color:#354b70;border-color:#dce6f5}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:22px 0}.metric{background:#f7f8fb;border:1px solid #eceef3;border-radius:16px;padding:17px 19px}.metric small{display:block;color:#697286;font-size:.84rem;margin-bottom:8px}.metric strong{font-size:1.55rem;font-weight:650;color:#34435f;letter-spacing:-.03em}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0 24px}.field{gap:8px;color:#46516a;font-size:.91rem}.field input{padding:14px 15px;border:1px solid #e1e4ec;border-radius:12px;background:#f6f7fa;color:#26334b}.formula{display:inline-flex;gap:9px;flex-wrap:wrap;background:#f4f1f6;color:#64556d;padding:11px 15px;border-radius:12px;font-size:.88rem;margin:7px 7px 7px 0}.result{background:#edf5f1;color:#365e50;border-radius:15px;padding:17px 20px;margin:18px 0}.chartbox{background:#fbfbfd;border:1px solid #eceef3;border-radius:16px;padding:18px;margin:20px 0}.bars{display:flex;align-items:end;gap:5px;height:180px;padding:10px 8px 0;border-bottom:1px solid #cfd5df;overflow-x:auto}.barcol{min-width:22px;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:6px}.bar{width:min(100%,34px);min-height:2px;background:linear-gradient(180deg,#aebfe0,#d9dff0);border-radius:7px 7px 0 0}.barcol span{font-size:.68rem;color:#657087;white-space:nowrap}.barlabel{font-size:.75rem;color:#657087;text-align:center;margin-top:8px}.subtle{font-size:.86rem;color:#737c8d;margin:10px 0 0}table{margin:18px 0}th{color:#5c6880;background:#f7f8fb}td,th{padding:11px 13px}.normal-svg{width:100%;height:auto;max-width:680px;display:block;margin:10px auto}.example-card{background:#fff;border:1px solid #e8e8ef;border-radius:17px;padding:22px;margin:18px 0}.example-card h3{margin-top:0}@media(max-width:620px){#app{padding:14px}.panel{padding:19px}header{padding:25px}.metric strong{font-size:1.3rem}}`;
document.head.appendChild(style);
const base=[1,9,12,14,16,20];let activity=0,mode='rep',lastA4='prop';const titles=['1. Muestreo de medias','2. Medias esperadas','3. Probabilidad y normal','4. Proporciones, diferencias y sumas'];
function metric(label,value){return `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}function formula(t){return `<span class="formula">${t}</span>`}function field(label,id,value,type='text'){return `<label class="field">${label}<input id="${id}" type="${type}" value="${value}" step="any"></label>`}function bars(values){const counts={};values.forEach(v=>{const k=fmt(v);counts[k]=(counts[k]||0)+1});const entries=Object.entries(counts),max=Math.max(...entries.map(e=>e[1]));return `<div class="chartbox"><b>Frecuencia de las medias muestrales</b><div class="bars">${entries.map(([k,v])=>`<div class="barcol"><span>${v}</span><div class="bar" style="height:${Math.max(3,v/max*135)}px"></div><span>${k}</span></div>`).join('')}</div></div>`}
function samples(a,n,rep){const out=[];function go(arr,start){if(arr.length===n){out.push(arr.slice());return}for(let i=rep?0:start;i<a.length;i++){arr.push(a[i]);go(arr,rep?0:i+1);arr.pop()}}go([],0);return out}
function shell(){ $('#tabs').innerHTML=titles.map((t,i)=>`<button class="${i===activity?'active':''}" data-act="${i}">${t}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activity=+b.dataset.act;draw()});if(activity===0)page1();if(activity===1)page2();if(activity===2)page3();if(activity===3)page4()}
function page1(){const c=$('#content');c.innerHTML=`<div class="panel"><h2>Actividad 1 · Distribución muestral de medias</h2><p class="intro">Una planta de producción registra los tiempos de operación de seis piezas: 1, 9, 12, 14, 16 y 20 minutos. Se estudian todas las muestras posibles de tamaño 2.</p>${field('Valores de la población','pop1',base.join(', '))}<div id="popstats" class="metrics"></div><div>${formula('Media: μ = Σx / N')}${formula('Varianza: σ² = Σ(x − μ)² / N')}${formula('Desviación: σ = √σ²')}</div><div class="subtabs"><button id="rep" class="active">a) Con reposición</button><button id="norep">b) Sin reposición</button></div><div id="samplearea"></div></div>`;$('#pop1').oninput=update1;$('#rep').onclick=()=>{mode='rep';update1()};$('#norep').onclick=()=>{mode='norep';update1()};update1()}
function update1(){const a=$('#pop1').value.split(/[,;\s]+/).filter(Boolean).map(Number);if(a.length<2||a.some(x=>!Number.isFinite(x))){$('#popstats').innerHTML='';$('#samplearea').innerHTML='<p class="subtle">Ingresa al menos dos valores válidos.</p>';return}if(a.length>60){$('#popstats').innerHTML='';$('#samplearea').innerHTML='<p class="subtle">Usa como máximo 60 valores para poder listar todas las muestras.</p>';return}const mu=avg(a),v=variance(a),sig=Math.sqrt(v);$('#popstats').innerHTML=metric('Tamaño de población (N)',a.length)+metric('Media poblacional (μ)',fmt(mu))+metric('Varianza poblacional (σ²)',fmt(v))+metric('Desviación poblacional (σ)',fmt(sig));$('#rep').classList.toggle('active',mode==='rep');$('#norep').classList.toggle('active',mode==='norep');const ss=samples(a,2,mode==='rep'),ms=ss.map(avg),m=avg(ms),sv=variance(ms),sx=Math.sqrt(sv);$('#samplearea').innerHTML=`<div class="metrics">${metric('Número de muestras',ss.length)}${metric('Media de las medias',fmt(m))}${metric('Varianza de las medias (σₓ²)',fmt(sv))}${metric('Desviación de las medias (σₓ)',fmt(sx))}</div><div>${mode==='rep'?formula('Varianza de las medias: σ² / n')+formula('Desviación de las medias: σ / √n'):formula('Varianza de las medias: (σ² / n) · (N − n) / (N − 1)')+formula('Desviación de las medias: (σ / √n) · √[(N − n) / (N − 1)]')}${formula('Muestras: con reposición Nⁿ · sin reposición C(N,n)')}</div>${bars(ms)}<h3>Listado de muestras</h3>${tableHTML(ss.map((s,i)=>[s.join(' , '),fmt(ms[i])]),['Muestra','Media'])}`}
function tableHTML(rows,heads){return `<div style="overflow:auto"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function page2(){const c=$('#content');c.innerHTML=`<div class="panel"><h2>Actividad 2 · Distribución muestral de medias</h2><p class="intro">En una estación de ensamble se registraron tiempos de 8, 10, 12, 14 y 16 minutos. Se seleccionan muestras de tamaño 2 para estimar el tiempo promedio de trabajo.</p><div class="fields">${field('Tiempos registrados (min)','v2','8, 10, 12, 14, 16')}${field('Tamaño de muestra (n)','n2','2','number')}</div><div id="o2"></div></div>`;$('#v2').oninput=calc2;$('#n2').oninput=calc2;calc2()}
function calc2(){const a=$('#v2').value.split(/[,;\s]+/).filter(Boolean).map(Number),n=+$('#n2').value,o=$('#o2');if(a.length<2||a.some(x=>!Number.isFinite(x))||!Number.isInteger(n)||n<1||Math.pow(a.length,n)>200000){o.innerHTML='<p class="subtle">Revisa los valores y el tamaño de muestra (entero ≥ 1, con máximo 200 000 muestras posibles).</p>';return}const ss=samples(a,n,true),ms=ss.map(avg),mu=avg(a),v=variance(a),sig=Math.sqrt(v),sv=variance(ms);o.innerHTML=`<div class="metrics">${metric('Media poblacional (μ)',fmt(mu))}${metric('Varianza poblacional (σ²)',fmt(v))}${metric('Desviación poblacional (σ)',fmt(sig))}${metric('Media esperada (μx̄)',fmt(avg(ms)))}${metric('Varianza de las medias (σₓ²)',fmt(sv))}${metric('Desviación de las medias (σₓ)',fmt(Math.sqrt(sv)))}</div>${formula('E(x̄) = μ')}${formula('Var(x̄) = σ² / n')}${formula('σx̄ = σ / √n')}<p class="subtle">Se enumeran ${ss.length} muestras posibles con reposición.</p>${bars(ms)}<h3>Listado de muestras</h3>${ss.length<=2000?tableHTML(ss.map((s,i)=>[s.join(' , '),fmt(ms[i])]),['Muestra','Media']):'<p class="subtle">Hay demasiadas muestras para listarlas (máximo 2 000).</p>'}`}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
function page3(){const c=$('#content');c.innerHTML=`<div class="panel"><h2>Actividad 3 · Probabilidad en la distribución normal</h2><p class="intro">Una máquina tarda en promedio 45 minutos en ensamblar una pieza, con desviación estándar de 8 minutos. Se toma una muestra de 36 piezas. ¿Cuál es la probabilidad de que el tiempo promedio supere los 47 minutos?</p><div class="fields">${field('Media poblacional (μ)','mu3','45','number')}${field('Desviación poblacional (σ)','sig3','8','number')}${field('Tamaño de muestra (n)','n3','36','number')}${field('Tiempo límite (minutos)','x3','47','number')}</div><div id="o3"></div><div class="chartbox"><b>Campana de Gauss · probabilidad de superar el límite</b><svg id="gauss" class="normal-svg" viewBox="0 0 640 290" role="img" aria-label="Campana normal con cola derecha sombreada"></svg></div>${formula('μx̄ = μ')}${formula('Var(x̄) = σ² / n')}${formula('σx̄ = σ / √n')}${formula('z = (x̄ − μ) / σx̄')}</div>`;['mu3','sig3','n3','x3'].forEach(id=>$('#'+id).oninput=calc3);calc3()}
function calc3(){const mu=+$('#mu3').value,sig=+$('#sig3').value,n=+$('#n3').value,x=+$('#x3').value,o=$('#o3');if(sig<=0||n<=0){o.innerHTML='<p class="subtle">La desviación y el tamaño de muestra deben ser mayores que cero.</p>';return}const se=sig/Math.sqrt(n),v=se*se,z=tz((x-mu)/se),p=+(1-tcdf(z)).toFixed(4);o.innerHTML=`<div class="metrics">${metric('Media de las medias',fmt(mu))}${metric('Varianza de las medias',fmt(v))}${metric('Desviación de las medias',fmt(se))}${metric('Valor Z',fmt(z))}</div><div class="result"><b>Respuesta:</b> P( x̄ &gt; ${fmt(x)} ) = P( Z &gt; ${fmt(z)} ) = <b>${pct(p)}</b><br>Hay aproximadamente un ${pct(p)} de probabilidad de que el tiempo promedio de la muestra supere ${fmt(x)} minutos.</div><p class="subtle">Z se trunca a 2 decimales y la probabilidad se lee en la tabla normal estándar (4 decimales).</p>`;drawGauss(z)}
function drawGauss(z){const svg=$('#gauss'),pts=[];for(let i=0;i<=240;i++){const t=-4+i/30,y=220-165*Math.exp(-t*t/2);pts.push([35+i*2.38,y])}const cut=Math.max(0,Math.min(240,Math.round((z+4)*30)));const curve='M'+pts.map(p=>p.join(' ')).join(' L');const tail='M'+pts[cut][0]+' 220 L'+pts.slice(cut).map(p=>p.join(' ')).join(' L')+' L'+pts[240][0]+' 220 Z';svg.innerHTML=`<path d="M35 220H610" stroke="#9ba5b7"/><path d="${tail}" fill="#e7c9da" opacity=".9"/><path d="${curve}" fill="none" stroke="#7187b5" stroke-width="3"/><line x1="${pts[cut][0]}" x2="${pts[cut][0]}" y1="45" y2="220" stroke="#b46e91" stroke-dasharray="6 5"/><text x="320" y="260" text-anchor="middle" fill="#647087" font-size="13">Media muestral estandarizada (Z)</text><text x="${Math.min(540,pts[cut][0]+8)}" y="48" fill="#9b5d7b" font-size="13">Z = ${fmt(z)}</text>`}
function page4(){const c=$('#content');c.innerHTML=`<div class="panel"><h2>Actividad 4 · Otras distribuciones muestrales</h2><p class="intro">Tres situaciones independientes de control de calidad y producción. Selecciona el ejemplo que deseas analizar.</p><div class="subtabs"><button id="p4prop">1. Proporciones</button><button id="p4diff">2. Diferencias</button><button id="p4sum">3. Sumas</button></div><div id="p4body"></div></div>`;$('#p4prop').onclick=()=>{lastA4='prop';calc4()};$('#p4diff').onclick=()=>{lastA4='diff';calc4()};$('#p4sum').onclick=()=>{lastA4='sum';calc4()};calc4()}
function calc4(){['prop','diff','sum'].forEach(k=>$('#p4'+k).classList.toggle('active',lastA4===k));const b=$('#p4body');if(lastA4==='prop'){b.innerHTML=`<div class="example-card"><h3>Ejemplo 1 · Distribución muestral de proporciones</h3><p>En una fábrica, el 8% de los productos suele presentar defectos. Se inspecciona una muestra aleatoria de 100 productos. Calcula la media, varianza y desviación esperadas de la proporción defectuosa.</p><p><b>Pregunta:</b> si elegimos una muestra al azar de 100 productos, ¿cuál es la probabilidad de que encontremos más del 10% de productos defectuosos?</p><div class="fields">${field('Proporción defectuosa (p)','p4p','0.08','number')}${field('Tamaño de muestra (n)','p4n','100','number')}${field('Proporción límite (p̂ &gt;)','p4l','0.10','number')}</div><div id="r4"></div></div>`;['p4p','p4n','p4l'].forEach(id=>$('#'+id).oninput=calc4result)}else if(lastA4==='diff'){b.innerHTML=`<div class="example-card"><h3>Ejemplo 2 · Distribución muestral de diferencias</h3><p>Dos líneas fabrican piezas. En la línea A, el 8% de 100 piezas es defectuoso; en la línea B, el 5% de 120 piezas es defectuoso. Calcula la diferencia esperada entre proporciones y su variabilidad.</p><p><b>Pregunta:</b> ¿cuál es la probabilidad de que la Línea A tenga un 3% o más de piezas defectuosas que la Línea B?</p><div class="fields">${field('Proporción A (p₁)','p41','0.08','number')}${field('Muestra A (n₁)','n41','100','number')}${field('Proporción B (p₂)','p42','0.05','number')}${field('Muestra B (n₂)','n42','120','number')}${field('Diferencia mínima (p̂₁ − p̂₂ ≥)','d4','0.03','number')}</div><div id="r4"></div></div>`;['p41','n41','p42','n42','d4'].forEach(id=>$('#'+id).oninput=calc4result)}else{b.innerHTML=`<div class="example-card"><h3>Ejemplo 3 · Distribución muestral de sumas</h3><p>En una línea de producción, la primera operación tarda 10 minutos en promedio, con desviación de 2 minutos. La segunda tarda 6 minutos, con desviación de 1,5 minutos. Si los tiempos son independientes, calcula la media, varianza y desviación de la suma.</p><p><b>Pregunta:</b> ¿cuál es la probabilidad de que todo el proceso tarde entre 13,5 y 18,5 minutos?</p><div class="fields">${field('Media operación A (min)','m41','10','number')}${field('Desviación operación A (min)','s41','2','number')}${field('Media operación B (min)','m42','6','number')}${field('Desviación operación B (min)','s42','1.5','number')}${field('Límite inferior (min)','l4','13.5','number')}${field('Límite superior (min)','u4','18.5','number')}</div><div id="r4"></div></div>`;['m41','s41','m42','s42','l4','u4'].forEach(id=>$('#'+id).oninput=calc4result)}calc4result()}
function tcdf(z){return +((1+erf(z/Math.SQRT2))/2).toFixed(4)}
function pct(x){return (x*100).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+' %'}
function warn(ok){return ok?'':'<p class="subtle">⚠ Con n·p o n·(1 − p) menores que 5 la aproximación normal no es adecuada.</p>'}
function tz(z){return (Math.trunc(+(z*100).toFixed(6))/100)||0}
function drawArea(id,lo,hi,mu,sd,fx,cap){const svg=$('#'+id);if(!svg)return;const X=t=>35+(t+4)*71.4,Y=t=>220-165*Math.exp(-t*t/2);const zl=lo==null?-Infinity:(lo-mu)/sd,zh=hi==null?Infinity:(hi-mu)/sd,a=Math.max(-4,zl),b=Math.min(4,zh);let curve='M';for(let i=0;i<=240;i++){const t=-4+i/30;curve+=(i?' L':'')+X(t).toFixed(1)+' '+Y(t).toFixed(1)}let shade='';if(a<b){shade='M'+X(a).toFixed(1)+' 220';const k=Math.max(2,Math.ceil((b-a)*30));for(let i=0;i<=k;i++){const t=a+(b-a)*i/k;shade+=' L'+X(t).toFixed(1)+' '+Y(t).toFixed(1)}shade+=' L'+X(b).toFixed(1)+' 220 Z'}let marks='';[zl,zh].forEach(z=>{if(isFinite(z)&&z>-4&&z<4){marks+=`<line x1="${X(z)}" x2="${X(z)}" y1="45" y2="220" stroke="#b46e91" stroke-dasharray="6 5"/><text x="${Math.min(590,Math.max(50,X(z)))}" y="38" text-anchor="middle" fill="#9b5d7b" font-size="13">Z = ${fmt(tz(z))}</text>`}});let ticks='';for(let k=-3;k<=3;k++){ticks+=`<line x1="${X(k)}" x2="${X(k)}" y1="220" y2="225" stroke="#9ba5b7"/><text x="${X(k)}" y="241" text-anchor="middle" fill="#647087" font-size="12">${fx(mu+k*sd)}</text>`}svg.innerHTML=`<path d="M35 220H610" stroke="#9ba5b7"/><path d="${shade}" fill="#e7c9da" opacity=".9"/><path d="${curve}" fill="none" stroke="#7187b5" stroke-width="3"/>${marks}${ticks}<text x="320" y="272" text-anchor="middle" fill="#647087" font-size="13">${cap}</text>`}
function calc4result(){const r=$('#r4');if(!r)return;const v=id=>+$('#'+id).value,pct=x=>(x*100).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+' %',cdf=z=>(1+erf(z/Math.SQRT2))/2,tcdf=z=>+cdf(z).toFixed(4),box='<div class="chartbox"><b>Campana de Gauss · el área sombreada es la probabilidad</b><svg id="g4" class="normal-svg" viewBox="0 0 640 290" role="img" aria-label="Campana normal con el área de probabilidad sombreada"></svg></div>';if(lastA4==='prop'){const p=v('p4p'),n=v('p4n'),lim=v('p4l');if(p<0||p>1||n<=0){r.innerHTML='Verifica que p esté entre 0 y 1 y n sea positivo.';return}const q=p*(1-p)/n,s=Math.sqrt(q);if(s<=0){r.innerHTML='La desviación es cero; revisa p.';return}const z=tz((lim-p)/s),pr=+(1-tcdf(z)).toFixed(4);r.innerHTML=`<div class="metrics">${metric('Media esperada (p̂)',fmt(p))}${metric('Varianza',fmt(q))}${metric('Desviación típica',fmt(s))}${metric('Valor Z',fmt(z))}</div>${formula('E(p̂) = p')}${formula('Var(p̂) = p(1 − p) / n')}${formula('σp̂ = √[p(1 − p) / n]')}${formula('z = (p̂ − p) / σp̂')}<div class="result"><b>Respuesta:</b> P( p̂ &gt; ${pct(lim)} ) = P( Z &gt; ${fmt(z)} ) = <b>${pct(pr)}</b><br>Hay aproximadamente un ${pct(pr)} de probabilidad de encontrar más del ${pct(lim)} de productos defectuosos en la muestra.</div><p class="subtle">Z se trunca a 2 decimales y la probabilidad se lee en la tabla normal estándar (4 decimales).</p>${warn(n*p>=5&&n*(1-p)>=5)}${box}`;drawArea('g4',lim,null,p,s,x=>(x*100).toFixed(1)+'%','Proporción muestral de defectuosos (p̂)')}else if(lastA4==='diff'){const p=v('p41'),q=v('p42'),n=v('n41'),m=v('n42'),d=v('d4');if(p<0||p>1||q<0||q>1||n<=0||m<=0){r.innerHTML='Revisa las proporciones y tamaños de muestra.';return}const vr=p*(1-p)/n+q*(1-q)/m,s=Math.sqrt(vr);if(s<=0){r.innerHTML='La desviación es cero; revisa las proporciones.';return}const mu=p-q,z=tz((d-mu)/s),pr=+(1-tcdf(z)).toFixed(4);r.innerHTML=`<div class="metrics">${metric('Media de la diferencia (p₁ − p₂)',fmt(mu))}${metric('Varianza',fmt(vr))}${metric('Desviación típica',fmt(s))}${metric('Valor Z',fmt(z))}</div>${formula('E(p̂₁ − p̂₂) = p₁ − p₂')}${formula('Var = p₁q₁/n₁ + p₂q₂/n₂')}${formula('z = (d − (p₁ − p₂)) / σ')}<div class="result"><b>Respuesta:</b> P( p̂₁ − p̂₂ ≥ ${pct(d)} ) = P( Z ≥ ${fmt(z)} ) = <b>${pct(pr)}</b><br>La probabilidad de que la Línea A tenga ${pct(d)} o más de piezas defectuosas que la Línea B es de aproximadamente ${pct(pr)}.</div><p class="subtle">Z se trunca a 2 decimales y la probabilidad se lee en la tabla normal estándar (4 decimales).</p>${warn(n*p>=5&&n*(1-p)>=5&&m*q>=5&&m*(1-q)>=5)}${box}`;drawArea('g4',d,null,mu,s,x=>(x*100).toFixed(1)+'%','Diferencia de proporciones (p̂₁ − p̂₂)')}else{const a=v('m41'),b=v('m42'),s1=v('s41'),s2=v('s42'),lo=v('l4'),hi=v('u4');if(s1<0||s2<0){r.innerHTML='Las desviaciones no pueden ser negativas.';return}const vr=s1*s1+s2*s2,s=Math.sqrt(vr);if(s<=0){r.innerHTML='La desviación de la suma es cero.';return}if(lo>hi){r.innerHTML='El límite inferior debe ser menor que el superior.';return}const mu=a+b,z1=tz((lo-mu)/s),z2=tz((hi-mu)/s),pr=+(tcdf(z2)-tcdf(z1)).toFixed(4);r.innerHTML=`<div class="metrics">${metric('Media de la suma',fmt(mu)+' min')}${metric('Varianza',fmt(vr)+' min²')}${metric('Desviación típica',fmt(s)+' min')}${metric('Z inferior / Z superior',fmt(z1)+' / '+fmt(z2))}</div>${formula('E(X + Y) = μX + μY')}${formula('Var(X + Y) = σX² + σY²')}${formula('σX+Y = √(σX² + σY²)')}<div class="result"><b>Respuesta:</b> P( ${fmt(lo)} &lt; X+Y &lt; ${fmt(hi)} ) = P( ${fmt(z1)} &lt; Z &lt; ${fmt(z2)} ) = <b>${pct(pr)}</b><br>La probabilidad de que todo el proceso tarde entre ${fmt(lo)} y ${fmt(hi)} minutos es de aproximadamente ${pct(pr)}.</div><p class="subtle">Z se trunca a 2 decimales y la probabilidad se lee en la tabla normal estándar (4 decimales).</p><p class="subtle">Se supone que los tiempos de ambas operaciones son independientes.</p>${box}`;drawArea('g4',lo,hi,mu,s,x=>x.toFixed(1),'Tiempo total del proceso (minutos)')}}
function draw(){shell()}function renderFinal(){draw()}renderFinal();
})();
</script><script>
const formulaNoteObserver=new MutationObserver(()=>document.querySelectorAll('.formula').forEach(el=>{if(el.textContent.includes('Muestras: con reposición'))el.textContent='Muestras: Nⁿ con reposición · C(N,n) sin reposición'}));formulaNoteObserver.observe(document.getElementById('content'),{childList:true,subtree:true});
</script></body></html>
